name: Tiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  build:
    runs-on: ubuntu-latest
    needs: shellcheck
    strategy:
      matrix:
        target: [world, finland, finland-hd, nordic-baltic]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: matrix.target == 'nordic-baltic'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: palikkaharrastajat
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install "github:cachix/devenv/v2.0.6"

      - name: Restore source data cache
        id: sources-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/${{ matrix.target }}
          key: ${{ matrix.target }}-sources-${{ hashFiles(format('scripts/generate-{0}.sh', matrix.target)) }}

      - name: Generate tiles
        run: devenv shell -- make ${{ matrix.target }}

      - name: Save source data cache
        if: steps.sources-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/${{ matrix.target }}
          key: ${{ steps.sources-cache-restore.outputs.cache-primary-key }}

      - name: Upload tiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.pmtiles
          compression-level: 0

  assemble:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: palikkaharrastajat
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install "github:cachix/devenv/v2.0.6"

      - name: Download tile artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Restore fonts cache
        id: fonts-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}

      - name: Restore vendor cache
        id: vendor-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/vendor
          key: vendor-${{ hashFiles('scripts/generate-style.sh') }}

      - name: Generate style and fonts
        run: devenv shell -- make style fonts

      - name: Save fonts cache
        if: steps.fonts-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fonts
          key: ${{ steps.fonts-cache-restore.outputs.cache-primary-key }}

      - name: Save vendor cache
        if: steps.vendor-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/vendor
          key: ${{ steps.vendor-cache-restore.outputs.cache-primary-key }}

      - name: Inspect archives
        run: |
          for f in dist/*.pmtiles; do
            echo "── $f"
            devenv shell -- pmtiles show "$f"
          done

      - name: Enforce GitHub Pages size budget
        run: |
          size=$(du -sb dist | cut -f1)
          echo "dist/ size: $size bytes ($(du -sh dist | cut -f1))"
          if [ "$size" -gt 996147200 ]; then
            echo "ERROR: dist/ exceeds the ~950 MB GitHub Pages budget." >&2
            exit 1
          fi

      - name: Upload style artifact
        uses: actions/upload-artifact@v4
        with:
          name: style
          path: |
            dist/style.json
            dist/index.html
            dist/vendor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: assemble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
