name: Tiles

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tiles-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts

  build:
    runs-on: ubuntu-latest
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        target: [world, finland, finland-hd, nordic-baltic, neighbours]
        # Cache only what a run cannot regenerate cheaply. Everything else is
        # dead weight against the 10 GB per-repo Actions cache limit.
        include:
          - target: world
            cache_path: .cache/world
          - target: finland
            # generate-finland.sh re-unzips mml_shape_250k/ (740 MB) and
            # rebuilds the merged *.geojson (400 MB) unconditionally on every
            # run, so caching them buys nothing — keep just the source zips.
            cache_path: .cache/finland/*.zip
          - target: finland-hd
            cache_path: .cache/finland-hd
          - target: nordic-baltic
            cache_path: .cache/nordic-baltic
          - target: neighbours
            cache_path: .cache/neighbours
    continue-on-error: ${{ matrix.target == 'finland-hd' || matrix.target == 'nordic-baltic' || matrix.target == 'neighbours' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # Both targets pull multi-GB Geofabrik extracts (the German one alone is
        # several GB) before filtering them down.
        if: matrix.target == 'nordic-baltic' || matrix.target == 'neighbours'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: palikkaharrastajat
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install "github:cachix/devenv/v2.0.6"

      - name: Restore source data cache
        id: sources-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ matrix.target }}-sources-${{ hashFiles(format('scripts/generate-{0}.sh', matrix.target)) }}
          restore-keys: |
            ${{ matrix.target }}-sources-

      - name: Generate tiles
        run: devenv shell -- make ${{ matrix.target }}

      - name: Save source data cache
        if: steps.sources-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.cache_path }}
          key: ${{ steps.sources-cache-restore.outputs.cache-primary-key }}

      - name: Upload tiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          # nordic-baltic and neighbours also emit dist/stations-<region>.geojson;
          # the other targets have no GeoJSON output and the missing-glob warning
          # is harmless.
          path: |
            dist/*.pmtiles
            dist/*.geojson
          compression-level: 0

      - name: Cache built PMTiles for fallback
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            dist/${{ matrix.target }}.pmtiles
            dist/stations-${{ matrix.target }}.geojson
          key: pmtiles-${{ matrix.target }}-${{ github.run_id }}

  assemble:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: cachix/cachix-action@v16
        with:
          name: palikkaharrastajat
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          extraPullNames: devenv

      - name: Install devenv
        run: nix profile install "github:cachix/devenv/v2.0.6"

      - name: Download tile artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Restore fallback PMTiles from cache
        run: |
          for target in world finland finland-hd nordic-baltic neighbours; do
            if [ ! -f "dist/${target}.pmtiles" ]; then
              echo "⚠ dist/${target}.pmtiles missing — will try cached fallback"
            fi
          done

      - name: Fallback world
        if: hashFiles('dist/world.pmtiles') == ''
        uses: actions/cache/restore@v4
        with:
          path: dist/world.pmtiles
          key: pmtiles-world-impossible
          restore-keys: pmtiles-world-

      - name: Fallback finland
        if: hashFiles('dist/finland.pmtiles') == ''
        uses: actions/cache/restore@v4
        with:
          path: dist/finland.pmtiles
          key: pmtiles-finland-impossible
          restore-keys: pmtiles-finland-

      - name: Fallback finland-hd
        if: hashFiles('dist/finland-hd.pmtiles') == ''
        uses: actions/cache/restore@v4
        with:
          path: dist/finland-hd.pmtiles
          key: pmtiles-finland-hd-impossible
          restore-keys: pmtiles-finland-hd-

      - name: Fallback nordic-baltic
        if: hashFiles('dist/nordic-baltic.pmtiles') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/nordic-baltic.pmtiles
            dist/stations-nordic-baltic.geojson
          key: pmtiles-nordic-baltic-impossible
          restore-keys: pmtiles-nordic-baltic-

      - name: Fallback neighbours
        if: hashFiles('dist/neighbours.pmtiles') == ''
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/neighbours.pmtiles
            dist/stations-neighbours.geojson
          key: pmtiles-neighbours-impossible
          restore-keys: pmtiles-neighbours-

      - name: Verify all archives present
        run: |
          missing=0
          for target in world finland finland-hd nordic-baltic neighbours; do
            if [ ! -f "dist/${target}.pmtiles" ]; then
              echo "::error::dist/${target}.pmtiles is missing and no fallback was found."
              missing=$((missing + 1))
            else
              echo "✓ dist/${target}.pmtiles ($(du -h "dist/${target}.pmtiles" | cut -f1))"
            fi
          done
          # style.json declares a `stations` GeoJSON source, so a missing file
          # would break the deployed style. merge-stations.sh tolerates one
          # region being absent, but not both.
          if ! ls dist/stations-*.geojson >/dev/null 2>&1; then
            echo "::error::no dist/stations-*.geojson present and no fallback was found."
            missing=$((missing + 1))
          else
            for f in dist/stations-*.geojson; do
              echo "✓ $f ($(du -h "$f" | cut -f1))"
            done
          fi
          if [ "$missing" -gt 0 ]; then
            exit 1
          fi

      - name: Restore fonts cache
        id: fonts-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/fonts
          key: fonts-${{ hashFiles('scripts/fetch-fonts.sh') }}

      - name: Restore vendor cache
        id: vendor-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/vendor
          key: vendor-${{ hashFiles('scripts/generate-style.sh') }}

      - name: Merge stations, generate style and fonts
        # merge-stations.sh directly, not `make stations`: in this job the
        # regional station files arrive as artifacts, and make would try to
        # *build* any that are missing — kicking off a full Planetiler run on
        # the assemble runner.
        run: devenv shell -- bash scripts/merge-stations.sh

      - name: Generate style and fonts
        run: devenv shell -- make style fonts

      - name: Save fonts cache
        if: steps.fonts-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fonts
          key: ${{ steps.fonts-cache-restore.outputs.cache-primary-key }}

      - name: Save vendor cache
        if: steps.vendor-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/vendor
          key: ${{ steps.vendor-cache-restore.outputs.cache-primary-key }}

      - name: Inspect and verify archives
        run: |
          fail=0
          for f in dist/*.pmtiles; do
            echo "── $f"
            devenv shell -- pmtiles show "$f"
            # `pmtiles verify` exits 0 even when it rejects an archive, so match
            # on its output rather than trusting the exit status.
            out=$(devenv shell -- pmtiles verify "$f" 2>&1)
            echo "$out"
            if echo "$out" | grep -q 'invalid'; then
              echo "::error::$f failed pmtiles verify"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Enforce GitHub Pages size budget
        run: |
          size=$(du -sb dist | cut -f1)
          echo "dist/ size: $size bytes ($(du -sh dist | cut -f1))"
          if [ "$size" -gt 996147200 ]; then
            echo "ERROR: dist/ exceeds the ~950 MB GitHub Pages budget." >&2
            exit 1
          fi

      - name: Upload style artifact
        uses: actions/upload-artifact@v4
        with:
          name: style
          path: |
            dist/style.json
            dist/index.html
            dist/vendor/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: assemble
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
